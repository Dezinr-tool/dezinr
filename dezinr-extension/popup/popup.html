<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dezinr QC</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; padding: 12px; width: 340px; background: #111827; color: #f9fafb; }
      .dzn-row { margin-bottom: 10px; }
      .dzn-input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #374151; border-radius: 8px; background: #1f2937; color: #f9fafb; }
      .dzn-btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
      .dzn-btn-primary { background: #2563eb; color: #fff; }
      .dzn-btn-danger { background: #7f1d1d; color: #fff; font-size: 12px; padding: 6px; margin-top: 14px; }
      .dzn-muted { color: #9ca3af; font-size: 12px; }
      .hidden { display: none; }
      .dzn-spinner {
        width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.35); border-top-color: #fff;
        border-radius: 50%; display: inline-block; animation: spin .8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="login-view">
      <div class="dzn-row"><strong>Dezinr QC</strong></div>
      <div class="dzn-row"><input id="email" class="dzn-input" type="email" placeholder="Email" /></div>
      <div class="dzn-row"><input id="password" class="dzn-input" type="password" placeholder="Password" /></div>
      <div class="dzn-row"><button id="login-btn" class="dzn-btn dzn-btn-primary">Login</button></div>
      <div id="login-error" class="dzn-muted"></div>
    </div>

    <div id="user-view" class="hidden">
      <div class="dzn-row">Logged in as <strong id="user-email"></strong></div>
      <div class="dzn-row">
        <div class="dzn-muted">Current Tab URL</div>
        <input id="tab-url" class="dzn-input" type="text" readonly />
      </div>
      <div class="dzn-row">
        <input id="figma-url" class="dzn-input" type="text" placeholder="Paste Figma file URL" />
      </div>
      <div class="dzn-row">
        <button id="start-analysis-btn" class="dzn-btn dzn-btn-primary">Start Analysis</button>
      </div>
      <div id="analysis-loading" class="dzn-row hidden">
        <span class="dzn-spinner"></span>
        <span style="margin-left:8px;font-size:12px;">Analyzing design...</span>
      </div>
      <div id="analysis-error" class="dzn-muted"></div>
      <div class="dzn-row"><button id="logout-btn" class="dzn-btn dzn-btn-danger">Logout</button></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
